# BotyTrader — non-secret behaviour settings
# Copy to config.toml at the project root. Safe to commit.

[gemini]
# Gemini model used for embeddings (Gemini Embedding API)
embedding_model = "text-embedding-004"

[model]
# local = transformers.js on disk (see cache_dir). huggingface_api = serverless
# Inference API (requires HF_TOKEN in .env).
provider = "local"
# Active Hugging Face model id (org/repo). For local: ONNX-capable causal LM.
# For huggingface_api: any Inference-supported chat/LM id from the Hub tab.
id = ""
# Quantisation hint forwarded to @huggingface/transformers.
# One of: auto | fp32 | fp16 | q8 | q4 | q4f16
dtype = "q4"
# Inference device. One of: auto | cpu | wasm | webgpu
device = "auto"
# Hard cap on completion tokens per ReAct turn.
max_new_tokens = 512
# Where pulled model files live (relative paths resolve under project root).
cache_dir = ".cache/models"

[huggingface]
# HF Storage Bucket for the long-term memory vector index.
bucket_name = "your-username/botytrader-memory"
endpoint = "https://huggingface.co"
region = "us-east-1"

[broker]
# One of: alpaca_paper | alpaca_live | coinbase | binance
# Paper is default. Simple trading engine uses Alpaca; Config → Trading can switch paper/live.
platform = "alpaca_paper"

[trading]
# Deterministic simple strategy (SQLite, FinBERT) — set enabled = false to skip engine timers.
enabled = true
# paper | live — also sets broker platform to alpaca_paper or alpaca_live when using Alpaca.
mode = "paper"
database_path = "~/.config/trading-cli/trades.db"
#
# Buy size (simple engine, market buys): uses cash balance, not full equity.
#   score_100     = (hybrid + 1) * 50     — hybrid ∈ [-1, 1] from strategy.simple
#   threshold_100 = (buy_threshold + 1) * 50   — same [strategy.simple] buy_threshold
#   conviction    = |score_100 − threshold_100| / 100   (larger when hybrid is far above the buy line)
#   notional_usd  = min(
#       positioning_scalar * cash * conviction,
#       equity * max_position_pct / 100
#     )
#   shares        = floor(notional_usd / last_close)  (hold if 0 — notional too small for 1 share)
#
# positioning_scalar: global dial on that dollar amount (default 1). Use e.g. 0.5 to invest half as much.
positioning_scalar = 1.0

[strategy.simple]
enabled = true
technical_weight = 0.6
sentiment_weight = 0.4
buy_threshold = 0.5
sell_threshold = -0.3
sma_fast_period = 20
sma_slow_period = 50
rsi_period = 14
# Neutral zone for SMA20 vs SMA50 crossover (fraction of last close, e.g. 0.001 = 0.1%).
sma_neutral_band = 0.001

[sentiment]
# local_finbert | hybrid_finbert | huggingface_api | disabled
# - local_finbert: Transformers.js ONNX on disk (see Config → Models → Download).
# - huggingface_api: HF Inference only — set HF_TOKEN in .env (https://huggingface.co/settings/tokens).
# - hybrid_finbert: mix API + local; hf_api_runs_* = "numerator of denominator" symbol-level sentiment batches use API first.
#   On HTTP 429 the app falls back to local FinBERT for ~90s (see src/trading/sentiment/finbert.ts).
# Prefer ProsusAI/finbert as model_id; local Node resolves to Xenova/finbert (ONNX).
provider = "local_finbert"
model_id = "ProsusAI/finbert"
cache_ttl_hours = 24
# Hybrid only: e.g. 1 / 2 = half the batches try HF Inference first (then local if rate-limited or no token).
hf_api_runs_numerator = 1
hf_api_runs_denominator = 2

[schedule]
# Seconds between agent cycles
agent_interval_seconds = 300
# Seconds between exit-monitor sweeps (stop-loss / take-profit)
exit_monitor_interval_seconds = 30
# Simple trading engine cycles
portfolio_cycle_seconds = 300
candidate_cycle_seconds = 1800

[risk]
max_position_pct = 10.0
min_confidence_to_trade = 0.6
stop_loss_pct = 2.0
take_profit_pct = 5.0

# Your tradable universe — not built into the app; replace with any tickers you want evaluated.
# At least one symbol is required. Same list is editable in the TUI (Insights or Config → Trading).
[watchlist]
symbols = ["SPY", "QQQ"]

[autotrade]
# When false, orchestrator logs decisions but does not submit orders.
enabled = false

# Autonomous optimizer — feature snapshots, walk-forward challengers, learning-rate nudges to config.
[optimization]
enabled = false
# daily | sunday | monday | … | saturday — which local day to run (ignored when daily).
schedule_day = "daily"
# Local hour 0–23 (runs once within the first ~6 minutes of that hour).
schedule_hour = 2
lookback_days = 14
challenger_count = 50
mutation_rate = 0.02
learning_rate = 0.1
improvement_threshold = 0.1
max_single_weight = 0.3
stress_test_enabled = true
# Near-miss hybrids below buy_threshold but within this fraction still get a snapshot row.
shadow_capture_range = 0.2
# Hours until outcome % is computed from price_history daily closes.
exit_window_hours = 48
# Challenger tuning (also written into feature snapshot metadata; nudged when optimizer wins).
challenger_swap_threshold = 10
challenger_min_entry_score = 75
min_snapshots = 10
outcome_monitor_interval_minutes = 30

[features]
# Long-term memory (Gemini embeddings + HF bucket). Keys stay in .env when off; app skips RAG/writes.
memory_enabled = true
# Expose brave_web_search to the model when true and BRAVE_API_KEY is set.
web_search_enabled = false

[agent]
# Hard cap on ReAct iterations per cycle.
max_iterations = 8
# 0 = favour technicals; 1 = favour sentiment/news in the cycle prompt (Config → Models: ±)
sentiment_weight = 0.35
# Optional. Customise the reasoning system prompt (must keep the Final JSON
# decision contract intact, otherwise the orchestrator falls back to "hold").
# system_prompt = """..."""
