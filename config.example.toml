# BotyTrader — non-secret behaviour settings
# Copy to config.toml at the project root. Safe to commit.

[gemini]
# Gemini model used for embeddings (Gemini Embedding API)
embedding_model = "text-embedding-004"

[model]
# local = transformers.js on disk (see cache_dir). huggingface_api = serverless
# Inference API (requires HF_TOKEN in .env).
provider = "local"
# Active Hugging Face model id (org/repo). For local: ONNX-capable causal LM.
# For huggingface_api: any Inference-supported chat/LM id from the Hub tab.
id = ""
# Quantisation hint forwarded to @huggingface/transformers.
# One of: auto | fp32 | fp16 | q8 | q4 | q4f16
dtype = "q4"
# Inference device. One of: auto | cpu | wasm | webgpu
device = "auto"
# Hard cap on completion tokens per ReAct turn.
max_new_tokens = 512
# Where pulled model files live (relative paths resolve under project root).
cache_dir = ".cache/models"

[huggingface]
# HF Storage Bucket for the long-term memory vector index.
bucket_name = "your-username/botytrader-memory"
endpoint = "https://huggingface.co"
region = "us-east-1"

[broker]
# One of: alpaca_paper | alpaca_live | coinbase | binance
# Paper is default. Simple trading engine uses Alpaca; Config → Trading can switch paper/live.
platform = "alpaca_paper"

[trading]
# Deterministic simple strategy (SQLite, FinBERT) — set enabled = false to skip engine timers.
enabled = true
# paper | live — also sets broker platform to alpaca_paper or alpaca_live when using Alpaca.
mode = "paper"
database_path = "~/.config/trading-cli/trades.db"

[strategy.simple]
enabled = true
technical_weight = 0.6
sentiment_weight = 0.4
buy_threshold = 0.5
sell_threshold = -0.3
sma_fast_period = 20
sma_slow_period = 50
rsi_period = 14
# Neutral zone for SMA20 vs SMA50 crossover (fraction of last close, e.g. 0.001 = 0.1%).
sma_neutral_band = 0.001

[sentiment]
# local_finbert / huggingface_api / disabled. Prefer ProsusAI/finbert as id; local Node pulls Xenova/finbert (ONNX).
provider = "local_finbert"
model_id = "ProsusAI/finbert"
cache_ttl_hours = 24

[schedule]
# Seconds between agent cycles
agent_interval_seconds = 300
# Seconds between exit-monitor sweeps (stop-loss / take-profit)
exit_monitor_interval_seconds = 30
# Simple trading engine cycles
portfolio_cycle_seconds = 300
candidate_cycle_seconds = 1800
discovery_cycle_seconds = 14400

[risk]
max_position_pct = 10.0
min_confidence_to_trade = 0.6
stop_loss_pct = 2.0
take_profit_pct = 5.0

[watchlist]
symbols = ["SPY", "QQQ"]

[autotrade]
# When false, orchestrator logs decisions but does not submit orders.
enabled = false

# Discovery scanner — finds new stocks beyond the watchlist
[discovery]
enabled = false
# Scan every 4 hours for new opportunities
scan_interval_seconds = 14400
# Evaluate up to 20 candidates per scan
max_candidates = 20
# Minimum rank score (0-100) to consider
min_rank_score = 50
# Max new positions per scan
max_new_positions = 3
# Auto-invest in top discoveries
auto_invest = false
# Hybrid score threshold for auto-investment
invest_threshold = 0.4
# Cooldown before rediscovering (hours)
cooldown_hours = 48
# Include ETFs and tech stocks in scans
include_etfs = true
include_tech = true
# News query for discovering trending stocks
news_query = "stocks earnings"
#
# NEW USER AUTO-DISCOVERY:
# When enabled + auto_invest is true, if you have NO positions in your portfolio,
# the bot will automatically run discovery and invest in the top 3-5 best stocks
# to get your portfolio started. This only runs once when positions are empty.
#
# To enable: discovery.enabled = true AND discovery.auto_invest = true

[features]
# Long-term memory (Gemini embeddings + HF bucket). Keys stay in .env when off; app skips RAG/writes.
memory_enabled = true
# Expose brave_web_search to the model when true and BRAVE_API_KEY is set.
web_search_enabled = false

[agent]
# Hard cap on ReAct iterations per cycle.
max_iterations = 8
# 0 = favour technicals; 1 = favour sentiment/news in the cycle prompt (Config → Models: ±)
sentiment_weight = 0.35
# Optional. Customise the reasoning system prompt (must keep the Final JSON
# decision contract intact, otherwise the orchestrator falls back to "hold").
# system_prompt = """..."""
