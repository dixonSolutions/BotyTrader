name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Compile binary
        run: npm run compile

      - name: Package .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sudo gem install fpm --no-document
          fpm \
            --input-type dir \
            --output-type deb \
            --name botytrader \
            --version "$VERSION" \
            --architecture amd64 \
            --description "Terminal-based AI trading assistant" \
            --maintainer "BotyTrader Maintainers" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            --prefix /usr/local/bin \
            bin/botytrader
          echo "DEB=botytrader_${VERSION}_amd64.deb" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB }}

      - name: Publish APT repository (docs/ on default branch)
        env:
          APT_GPG_PRIVATE_KEY_NEW: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PRIVATE_KEY_LEGACY: ${{ secrets.GPG_PRIVATE_KEY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export APT_GPG_PRIVATE_KEY="${APT_GPG_PRIVATE_KEY_NEW:-${APT_GPG_PRIVATE_KEY_LEGACY:-}}"
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout "${DEFAULT_BRANCH}"
          git reset --hard "origin/${DEFAULT_BRANCH}"
          bash scripts/ci-publish-apt.sh
