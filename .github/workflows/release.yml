name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Package .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sudo gem install fpm --no-document
          npm prune --omit=dev

          mkdir -p package-root/usr/local/bin
          mkdir -p package-root/opt/botytrader
          cp -a dist node_modules package.json package-lock.json package-root/opt/botytrader/
          cp -a config.example.toml .env.example package-root/opt/botytrader/
          cat > package-root/usr/local/bin/botytrader <<'SCRIPT'
          #!/usr/bin/env bash
          export NODE_NO_WARNINGS=1
          exec node /opt/botytrader/dist/index.js "$@"
          SCRIPT
          chmod 0755 package-root/usr/local/bin/botytrader

          fpm \
            --input-type dir \
            --output-type deb \
            --name botytrader \
            --version "$VERSION" \
            --architecture amd64 \
            --description "Terminal-based AI trading assistant" \
            --maintainer "BotyTrader Maintainers" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            --depends "nodejs (>= 20)" \
            --chdir package-root \
            opt usr
          echo "DEB=botytrader_${VERSION}_amd64.deb" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB }}
