name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Compile binary
        run: npm run compile

      - name: Package .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sudo gem install fpm --no-document
          fpm \
            --input-type dir \
            --output-type deb \
            --name botytrader \
            --version "$VERSION" \
            --architecture amd64 \
            --description "Terminal-based AI trading assistant" \
            --maintainer "BotyTrader Maintainers" \
            --url "https://github.com/${GITHUB_REPOSITORY}" \
            --prefix /usr/local/bin \
            bin/botytrader
          echo "DEB=botytrader_${VERSION}_amd64.deb" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB }}

      - name: Build APT Pages artifact
        env:
          APT_GPG_PRIVATE_KEY_NEW: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PRIVATE_KEY_LEGACY: ${{ secrets.GPG_PRIVATE_KEY }}
          PAGES_ROOT: ${{ runner.temp }}/botytrader-pages
        run: |
          export APT_GPG_PRIVATE_KEY="${APT_GPG_PRIVATE_KEY_NEW:-${APT_GPG_PRIVATE_KEY_LEGACY:-}}"
          bash scripts/ci-publish-apt.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/botytrader-pages

      - name: Deploy GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
