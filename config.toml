[gemini]
embedding_model = "text-embedding-004"

[model]
provider = "local"
id = "Xenova/TinyLlama-1.1B-Chat-v1.0"
dtype = "q4"
device = "auto"
max_new_tokens = 512
cache_dir = ".cache/models"

[huggingface]
bucket_name = "BorysTheBear/botytrader_memory"
endpoint = "https://huggingface.co"
region = "us-east-1"

[broker]
platform = "alpaca_paper"

[trading]
enabled = true
mode = "paper"
database_path = "~/.config/trading-cli/trades.db"
positioning_scalar = 1

[strategy.simple]
enabled = true
technical_weight = 0.6
sentiment_weight = 0.4
# Buy: +30% toward +1 from prior 0.2 → 0.44 (stricter full buys). Trim = prior buy line (partial band 0.2..0.44).
buy_threshold = 0.44
buy_trim_threshold = 0.2
# Sell: −30% toward −1 from prior −0.1 → −0.37 (stricter full exits). Trim = prior sell line (partial band −0.37..−0.1).
sell_threshold = -0.37
sell_trim_threshold = -0.1
sma_fast_period = 20
sma_slow_period = 50
rsi_period = 14
sma_neutral_band = 0.001

[indicators.sma]
enabled = true
weight = 0.15
period = 50
fast_period = 20

[indicators.ema]
enabled = true
weight = 0.1
fast_period = 12
slow_period = 26

[indicators.rsi]
enabled = true
weight = 0.12
period = 14
oversold = 30
overbought = 70

[indicators.macd]
enabled = true
weight = 0.1
fast_period = 12
slow_period = 26
signal_period = 9

[indicators.bollinger]
enabled = true
weight = 0.08
period = 20
std_dev = 2

[indicators.stochastic]
enabled = true
weight = 0.08
k_period = 14
d_period = 3
oversold = 20
overbought = 80

[indicators.atr]
enabled = true
weight = 0.05
period = 14
high_volatility_threshold = 0.05

[indicators.obv]
enabled = true
weight = 0.12

[indicators.fibonacci]
enabled = true
weight = 0.1
levels = [ 0.236, 0.382, 0.5, 0.618, 0.786 ]
proximity_threshold = 0.02

[indicators.ichimoku]
enabled = true
weight = 0.1
tenkan_period = 9
kijun_period = 26
senkou_b_period = 52
displacement = 26

[sentiment]
provider = "local_finbert"
model_id = "ProsusAI/finbert"
cache_ttl_hours = 24
hf_api_runs_numerator = 1
hf_api_runs_denominator = 2

[schedule]
agent_interval_seconds = 300
exit_monitor_interval_seconds = 30
portfolio_cycle_seconds = 300
candidate_cycle_seconds = 1_800

[risk]
max_position_pct = 10
min_confidence_to_trade = 0.6
stop_loss_pct = 2
take_profit_pct = 5

[watchlist]
symbols = [ "SPY", "QQQ", "NVDA", "MSFT", "ICE", "TSLA", "GOOG", "EDZ" ]

[autotrade]
enabled = true

[features]
memory_enabled = false
web_search_enabled = false

[agent]
system_prompt = """
You are BotyTrader, a disciplined trading assistant running locally.
You operate in a strict ReAct loop. On each turn produce EXACTLY ONE of:

  Thought: <one short sentence about what you need next>
  Action: tool_name({"arg": "value"})

OR, when you have enough evidence, terminate with:

  Final: {"action":"buy"|"sell"|"hold"|"close","symbol":"<ticker>","qty":<number>,"reasoning":"<one short paragraph>","confidence":<0..1>}

Rules:
- Use ONLY the tool names listed in the user message.
- Action arguments MUST be valid JSON on a single line.
- Do not invent fields. Do not output prose around Final.
- Prefer hold with low confidence when data is missing."""
max_iterations = 8
sentiment_weight = 0.35

[optimization]
enabled = true
schedule_day = "daily"
schedule_hour = 2
lookback_days = 14
challenger_count = 50
mutation_rate = 0.02
learning_rate = 0.1
improvement_threshold = 0.1
max_single_weight = 0.3
stress_test_enabled = true
shadow_capture_range = 0.2
exit_window_hours = 48
challenger_swap_threshold = 10
challenger_min_entry_score = 75
min_snapshots = 10
outcome_monitor_interval_minutes = 30
