[gemini]
embedding_model = "text-embedding-004"

[model]
provider = "local"
id = "Xenova/TinyLlama-1.1B-Chat-v1.0"
dtype = "q4"
device = "auto"
max_new_tokens = 512
cache_dir = ".cache/models"

[huggingface]
bucket_name = "BorysTheBear/botytrader_memory"
endpoint = "https://huggingface.co"
region = "us-east-1"

[broker]
platform = "alpaca_paper"

[trading]
enabled = true
mode = "paper"
database_path = "~/.config/trading-cli/trades.db"

[strategy.simple]
enabled = true
technical_weight = 0.6
sentiment_weight = 0.4
buy_threshold = 0.5
sell_threshold = -0.3
sma_fast_period = 20
sma_slow_period = 50
rsi_period = 14
sma_neutral_band = 0.001

[sentiment]
provider = "local_finbert"
model_id = "ProsusAI/finbert"
cache_ttl_hours = 24

[schedule]
agent_interval_seconds = 300
exit_monitor_interval_seconds = 30
portfolio_cycle_seconds = 300
candidate_cycle_seconds = 1_800
discovery_cycle_seconds = 600

[risk]
max_position_pct = 10
min_confidence_to_trade = 0.6
stop_loss_pct = 2
take_profit_pct = 5

[watchlist]
symbols = [ "SPY", "QQQ" ]

[autotrade]
enabled = true

[features]
memory_enabled = false
web_search_enabled = false

[agent]
system_prompt = """
You are BotyTrader, a disciplined trading assistant running locally.
You operate in a strict ReAct loop. On each turn produce EXACTLY ONE of:

  Thought: <one short sentence about what you need next>
  Action: tool_name({"arg": "value"})

OR, when you have enough evidence, terminate with:

  Final: {"action":"buy"|"sell"|"hold"|"close","symbol":"<ticker>","qty":<number>,"reasoning":"<one short paragraph>","confidence":<0..1>}

Rules:
- Use ONLY the tool names listed in the user message.
- Action arguments MUST be valid JSON on a single line.
- Do not invent fields. Do not output prose around Final.
- Prefer hold with low confidence when data is missing."""
max_iterations = 8
sentiment_weight = 0.35

[discovery]
enabled = false
scan_interval_seconds = 14_400
max_candidates = 20
min_rank_score = 50
max_new_positions = 3
auto_invest = false
invest_threshold = 0.4
cooldown_hours = 48
include_etfs = true
include_tech = true
news_query = "stocks earnings"
